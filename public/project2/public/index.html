<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat with GraphAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Chat with Alex Chen</h1>
            <p>AI Research Specialist</p>
        </header>
        
        <div class="chatbox" id="chatbox">
            <div class="message ai-message">
                <div class="message-content">
                    <p>Hello! I'm Alex Chen, an AI Research Specialist with expertise in machine learning and ethical AI development. How can I assist you today?</p>
                </div>
            </div>
        </div>
        
        <form id="chat-form">
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
                <button type="submit" id="send-button">Send</button>
            </div>
        </form>
    </div>
    
    <script src="client.js"></script>
</body>
</html>
