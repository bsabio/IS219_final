<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#f8f9fa" />
  
  <!-- Bar Chart -->
  <rect x="50" y="40" width="40" height="120" fill="#a5c8e4" rx="4" ry="4" />
  <rect x="100" y="60" width="40" height="100" fill="#d8c2f8" rx="4" ry="4" />
  <rect x="150" y="80" width="40" height="80" fill="#a5c8e4" rx="4" ry="4" />
  <rect x="200" y="50" width="40" height="110" fill="#d8c2f8" rx="4" ry="4" />
  
  <!-- Axis Line -->
  <line x1="40" y1="160" x2="260" y2="160" stroke="#5a6e7d" stroke-width="2" />
  
  <!-- Title -->
  <text x="150" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#5a6e7d">Data Visualization</text>
</svg>